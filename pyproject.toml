[project]
name = "formulalm"
version = "0.1.0"
description = "A small local Qwen3 model fine-tuned to turn plain-English spreadsheet requests into Excel formulas, verified by execution."
readme = "README.md"
license = "MIT"
authors = [{ name = "Abu Bakar", email = "abubakarp789@gmail.com" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "formulas>=1.3.4",
    "gradio>=6.32.0",
    "huggingface-hub>=2.4.0",
    "modelscope>=1.40.3",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "psutil>=7.2.2",
    "pyyaml>=6.0.4",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formulalm"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Keep natural-language phrasing strings one-per-line for readability.
"src/data/templates.py" = ["E501"]
"src/data/v2_augmentations.py" = ["E501"]
